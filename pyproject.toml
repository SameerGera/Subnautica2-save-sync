[project]
name = "subnautica-save-sync"
version = "1.0.0"
description = "P2P Game Save Synchronizer for Subnautica 2"
authors = [{name = "Player", email = "player@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.28.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]